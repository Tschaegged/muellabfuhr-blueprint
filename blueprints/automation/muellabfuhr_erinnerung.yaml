blueprint:
  name: Müllabfuhr-Erinnerung mit Bestätigung
  source_url: https://github.com/Tschaegged/muellabfuhr-blueprint/blob/main/blueprints/automation/muellabfuhr_erinnerung.yaml
  description: |
    # 🗑️ Müllabfuhr-Erinnerung mit Bestätigung

    Erinnert abends wenn morgen Müll abgeholt wird und wiederholt die
    Benachrichtigung bis jemand bestätigt.

    - **Telegram-Empfänger** erhalten einen Inline-Button direkt im Chat.
    - **Companion-App-Geräte** erhalten eine Benachrichtigung mit Bestätigungs-Action.
    - Wer auch immer bestätigt – alle weiteren Erinnerungen stoppen.

    Optional: Morgen-Erinnerung, falls bis zum Abholtag keine Bestätigung erfolgte.

    **Voraussetzungen:**
    - Einen `input_boolean`-Helfer anlegen, z. B. `tonne_rausgestellt`
      (Einstellungen → Geräte & Dienste → Helfer → Helfer hinzufügen → Schalter)
  domain: automation
  author: Claude
  homeassistant:
    min_version: "2024.10.0"

  input:
    section_abend:
      name: "📅 Abend-Erinnerung"
      icon: mdi:weather-sunset
      input:
        notification_time:
          name: Uhrzeit der ersten Erinnerung
          default: "18:00:00"
          selector:
            time: {}

        abend_bedingung:
          name: Bedingung – Abholung morgen?
          description: >
            Template das `true` zurückgibt wenn morgen Müll abgeholt wird.
          default: "{{ 'keine' not in states('sensor.mullabholung_morgen') | lower }}"
          selector:
            template: {}

        max_repeats:
          name: Max. Wiederholungen (abends)
          default: 4
          selector:
            number:
              min: 1
              max: 20
              step: 1

        repeat_interval:
          name: Wiederholungsintervall (abends)
          description: Minuten zwischen zwei Erinnerungen, wenn nicht bestätigt.
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min

    section_empfaenger:
      name: "🔔 Empfänger & Nachricht"
      icon: mdi:bell-ring
      input:
        notify_targets:
          name: Benachrichtigungsempfänger
          description: >
            Alle Geräte/Dienste die benachrichtigt werden sollen.
            Companion-App- und Telegram-Empfänger erhalten automatisch einen Bestätigungs-Button.
          selector:
            entity:
              domain: notify
              multiple: true

        notification_title:
          name: Benachrichtigungstitel
          default: "Mülltonne rausstellen!"
          selector:
            text: {}

        notification_message:
          name: Nachrichtentext (Template möglich)
          default: "{{ states('sensor.nachste_abholung_2') }}"
          selector:
            template: {}

    section_bestaetigung:
      name: "✅ Bestätigung"
      icon: mdi:check-circle-outline
      input:
        confirmed_boolean:
          name: Bestätigungs-Helfer
          description: >
            input_boolean der auf EIN gesetzt wird sobald jemand bestätigt hat.
          selector:
            entity:
              domain: input_boolean

    section_morgen:
      name: "☀️ Morgen-Erinnerung"
      icon: mdi:weather-sunset-up
      collapsed: true
      input:
        morning_reminder:
          name: Morgen-Erinnerung aktivieren
          default: true
          selector:
            boolean: {}

        morning_time:
          name: Uhrzeit (Morgen)
          default: "07:00:00"
          selector:
            time: {}

        morgen_bedingung:
          name: Bedingung – Abholung heute?
          default: "{{ 'keine' not in states('sensor.mullabholung_heute') | lower }}"
          selector:
            template: {}

        morning_max_repeats:
          name: Max. Wiederholungen (morgens)
          default: 2
          selector:
            number:
              min: 1
              max: 10
              step: 1

        morning_interval:
          name: Wiederholungsintervall (morgens)
          description: Minuten zwischen Morgen-Erinnerungen.
          default: 15
          selector:
            number:
              min: 5
              max: 60
              step: 5
              unit_of_measurement: min

variables:
  _title: !input notification_title
  _msg: !input notification_message
  _max: !input max_repeats
  _interval: !input repeat_interval
  _morning: !input morning_reminder
  _morning_max: !input morning_max_repeats
  _morning_int: !input morning_interval
  # Telegram: Button-Text = callback_data (HA sendet die gesamte Zeichenkette)
  _tg_callback: "✓ Tonne rausgestellt"
  # Companion App: Action-ID für mobile_app_notification_action
  _app_action: "MUELL_ERINNERUNG_OK"
  # Notification-Tag für Companion App (zum Ersetzen der Nachricht)
  _tag: "muell_erinnerung"

triggers:
  - trigger: time
    at: !input notification_time
    id: abend
  - trigger: time
    at: !input morning_time
    id: morgen

conditions: []

actions:
  - choose:
      # ── ABEND: Abholung morgen ─────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: abend
          - condition: template
            value_template: !input abend_bedingung
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input confirmed_boolean

          - repeat:
              while:
                - condition: state
                  entity_id: !input confirmed_boolean
                  state: "off"
                - condition: template
                  value_template: "{{ repeat.index <= _max | int }}"
              sequence:
                - repeat:
                    for_each: !input notify_targets
                    sequence:
                      - choose:
                          # Telegram → Inline-Button
                          - conditions:
                              - condition: template
                                value_template: "{{ 'telegram_bot' in repeat.item }}"
                            sequence:
                              - action: telegram_bot.send_message
                                data:
                                  entity_id: "{{ repeat.item }}"
                                  message: "🗑 {{ _title }}\n{{ _msg }}"
                                  parse_mode: plain_text
                                  inline_keyboard:
                                    - "{{ _tg_callback }}"
                          # Companion App (mobile_app) → Action-Button via Legacy-Service
                          - conditions:
                              - condition: template
                                value_template: "{{ repeat.item in integration_entities('mobile_app') }}"
                            sequence:
                              - action: >
                                  notify.mobile_app_{{ device_attr(device_id(repeat.item), 'name')
                                    | lower | replace('+', '') | replace(' ', '_') }}
                                data:
                                  title: "{{ _title }}"
                                  message: "{{ _msg }}"
                                  data:
                                    tag: "{{ _tag }}"
                                    # Sofort zustellen, auch im Energiesparmodus (Android haelt
                                    # Nachrichten normaler Prioritaet sonst zurueck)
                                    priority: high
                                    ttl: 0
                                    sticky: true
                                    actions:
                                      - action: "{{ _app_action }}"
                                        title: "✓ Tonne rausgestellt"
                        # Alle anderen → normaler notify
                        default:
                          - action: notify.send_message
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              title: "{{ _title }}"
                              message: "{{ _msg }}"

                - wait_for_trigger:
                    - trigger: event
                      event_type: telegram_callback
                      event_data:
                        data: "{{ _tg_callback }}"
                    - trigger: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ _app_action }}"
                  timeout:
                    minutes: "{{ _interval | int }}"
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  then:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: !input confirmed_boolean
                    - if:
                        - condition: template
                          value_template: "{{ wait.trigger.event.event_type == 'telegram_callback' }}"
                      then:
                        - action: telegram_bot.answer_callback_query
                          data:
                            callback_query_id: "{{ wait.trigger.event.data.id }}"
                            message: "✅ Tonne ist raus!"
                    - repeat:
                        for_each: !input notify_targets
                        sequence:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ 'telegram_bot' in repeat.item }}"
                                sequence:
                                  - action: telegram_bot.send_message
                                    data:
                                      entity_id: "{{ repeat.item }}"
                                      message: "✅ Tonne ist raus! Bestätigung erhalten – Danke!"
                                      parse_mode: plain_text
                              - conditions:
                                  - condition: template
                                    value_template: "{{ repeat.item in integration_entities('mobile_app') }}"
                                sequence:
                                  - action: >
                                      notify.mobile_app_{{ device_attr(device_id(repeat.item), 'name')
                                        | lower | replace('+', '') | replace(' ', '_') }}
                                    data:
                                      title: "✅ Tonne ist raus!"
                                      message: "Bestätigung erhalten – Danke!"
                                      data:
                                        tag: "{{ _tag }}"
                                        # Sofort zustellen, auch im Energiesparmodus (Android haelt
                                        # Nachrichten normaler Prioritaet sonst zurueck)
                                        priority: high
                                        ttl: 0
                            default:
                              - action: notify.send_message
                                target:
                                  entity_id: "{{ repeat.item }}"
                                data:
                                  title: "✅ Tonne ist raus!"
                                  message: "Bestätigung erhalten – Danke!"

      # ── MORGEN: Abholung heute, noch nicht bestätigt ───────────────────────
      - conditions:
          - condition: trigger
            id: morgen
          - condition: template
            value_template: "{{ _morning }}"
          - condition: state
            entity_id: !input confirmed_boolean
            state: "off"
          - condition: template
            value_template: !input morgen_bedingung
        sequence:
          - repeat:
              while:
                - condition: state
                  entity_id: !input confirmed_boolean
                  state: "off"
                - condition: template
                  value_template: "{{ repeat.index <= _morning_max | int }}"
              sequence:
                - repeat:
                    for_each: !input notify_targets
                    sequence:
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ 'telegram_bot' in repeat.item }}"
                            sequence:
                              - action: telegram_bot.send_message
                                data:
                                  entity_id: "{{ repeat.item }}"
                                  message: "⚠️ {{ _title }}\n{{ _msg }}"
                                  parse_mode: plain_text
                                  inline_keyboard:
                                    - "{{ _tg_callback }}"
                          - conditions:
                              - condition: template
                                value_template: "{{ repeat.item in integration_entities('mobile_app') }}"
                            sequence:
                              - action: >
                                  notify.mobile_app_{{ device_attr(device_id(repeat.item), 'name')
                                    | lower | replace('+', '') | replace(' ', '_') }}
                                data:
                                  title: "⚠️ {{ _title }}"
                                  message: "{{ _msg }}"
                                  data:
                                    tag: "{{ _tag }}"
                                    # Sofort zustellen, auch im Energiesparmodus (Android haelt
                                    # Nachrichten normaler Prioritaet sonst zurueck)
                                    priority: high
                                    ttl: 0
                                    sticky: true
                                    actions:
                                      - action: "{{ _app_action }}"
                                        title: "✓ Tonne rausgestellt"
                        default:
                          - action: notify.send_message
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              title: "⚠️ {{ _title }}"
                              message: "{{ _msg }}"

                - wait_for_trigger:
                    - trigger: event
                      event_type: telegram_callback
                      event_data:
                        data: "{{ _tg_callback }}"
                    - trigger: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ _app_action }}"
                  timeout:
                    minutes: "{{ _morning_int | int }}"
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  then:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: !input confirmed_boolean
                    - if:
                        - condition: template
                          value_template: "{{ wait.trigger.event.event_type == 'telegram_callback' }}"
                      then:
                        - action: telegram_bot.answer_callback_query
                          data:
                            callback_query_id: "{{ wait.trigger.event.data.id }}"
                            message: "✅ Tonne ist raus!"
                    - repeat:
                        for_each: !input notify_targets
                        sequence:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ 'telegram_bot' in repeat.item }}"
                                sequence:
                                  - action: telegram_bot.send_message
                                    data:
                                      entity_id: "{{ repeat.item }}"
                                      message: "✅ Tonne ist raus! Bestätigung erhalten – Danke!"
                                      parse_mode: plain_text
                              - conditions:
                                  - condition: template
                                    value_template: "{{ repeat.item in integration_entities('mobile_app') }}"
                                sequence:
                                  - action: >
                                      notify.mobile_app_{{ device_attr(device_id(repeat.item), 'name')
                                        | lower | replace('+', '') | replace(' ', '_') }}
                                    data:
                                      title: "✅ Tonne ist raus!"
                                      message: "Bestätigung erhalten – Danke!"
                                      data:
                                        tag: "{{ _tag }}"
                                        # Sofort zustellen, auch im Energiesparmodus (Android haelt
                                        # Nachrichten normaler Prioritaet sonst zurueck)
                                        priority: high
                                        ttl: 0
                            default:
                              - action: notify.send_message
                                target:
                                  entity_id: "{{ repeat.item }}"
                                data:
                                  title: "✅ Tonne ist raus!"
                                  message: "Bestätigung erhalten – Danke!"

mode: queued
max: 2
