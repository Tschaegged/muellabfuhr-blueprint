blueprint:
  name: Müllabfuhr-Erinnerung mit Bestätigung
  source_url: https://github.com/Tschaegged/muellabfuhr-blueprint/blob/main/blueprints/automation/muellabfuhr_erinnerung.yaml
  description: |
    # 🗑️ Müllabfuhr-Erinnerung mit Bestätigung

    Erinnert abends wenn morgen Müll abgeholt wird und wiederholt die
    Benachrichtigung bis jemand per Klick bestätigt, die Tonne rausgestellt zu haben.
    Companion-App-Geräte erhalten einen **Bestätigungs-Button** direkt in der
    Benachrichtigung. Telegram und andere Dienste erhalten die Textnachricht.

    Optional: Morgen-Erinnerung, falls bis zum Abholtag keine Bestätigung erfolgte.

    **Voraussetzungen:**
    - Einen `input_boolean`-Helfer anlegen, z. B. `tonne_rausgestellt`
      (Einstellungen → Geräte & Dienste → Helfer → Helfer hinzufügen → Schalter)
    - Eine Bedingung konfigurieren, die anzeigt ob morgen/heute Müll abgeholt wird
  domain: automation
  author: Claude
  homeassistant:
    min_version: "2024.10.0"

  input:
    section_abend:
      name: "📅 Abend-Erinnerung"
      icon: mdi:weather-sunset
      input:
        notification_time:
          name: Uhrzeit der ersten Erinnerung
          description: Abends, bevor die Tonne rausgestellt werden muss.
          default: "18:00:00"
          selector:
            time: {}

        abend_bedingung:
          name: Bedingung – Abholung morgen?
          description: >
            Template das `true` zurückgibt wenn morgen Müll abgeholt wird.
            Standard passt für Sensoren mit "keine" im Text wenn kein Termin.
          default: "{{ 'keine' not in states('sensor.mullabholung_morgen') | lower }}"
          selector:
            template: {}

        max_repeats:
          name: Max. Wiederholungen (abends)
          description: Nach wie vielen unbestätigten Erinnerungen abends aufhören?
          default: 4
          selector:
            number:
              min: 1
              max: 20
              step: 1

        repeat_interval:
          name: Wiederholungsintervall (abends)
          description: Minuten zwischen zwei Erinnerungen, wenn nicht bestätigt.
          default: 30
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min

    section_empfaenger:
      name: "🔔 Empfänger & Nachricht"
      icon: mdi:bell-ring
      input:
        notify_targets:
          name: Benachrichtigungsempfänger
          description: >
            Alle Geräte/Dienste die benachrichtigt werden sollen.
            Companion-App-Geräte erhalten einen Bestätigungs-Button in der Nachricht.
          selector:
            entity:
              domain: notify
              multiple: true

        notification_title:
          name: Benachrichtigungstitel
          default: "Mülltonne rausstellen!"
          selector:
            text: {}

        notification_message:
          name: Nachrichtentext (Template möglich)
          description: >
            Zeigt an was rausgestellt werden muss. Jinja2-Templates werden ausgewertet,
            z. B. `{{ states('sensor.nachste_abholung_2') }}`.
          default: "{{ states('sensor.nachste_abholung_2') }}"
          selector:
            template: {}

    section_bestaetigung:
      name: "✅ Bestätigung"
      icon: mdi:check-circle-outline
      input:
        confirmed_boolean:
          name: Bestätigungs-Helfer
          description: >
            input_boolean der auf EIN gesetzt wird sobald jemand bestätigt hat.
            Muss vorher als Helfer angelegt werden (z. B. input_boolean.tonne_rausgestellt).
          selector:
            entity:
              domain: input_boolean

    section_morgen:
      name: "☀️ Morgen-Erinnerung"
      icon: mdi:weather-sunset-up
      collapsed: true
      input:
        morning_reminder:
          name: Morgen-Erinnerung aktivieren
          description: Weitere Erinnerung am Abholtag selbst, falls noch nicht bestätigt.
          default: true
          selector:
            boolean: {}

        morning_time:
          name: Uhrzeit (Morgen)
          description: Zu dieser Zeit wird am Abholtag erinnert wenn noch nicht bestätigt.
          default: "07:00:00"
          selector:
            time: {}

        morgen_bedingung:
          name: Bedingung – Abholung heute?
          description: >
            Template das `true` zurückgibt wenn heute Müll abgeholt wird.
          default: "{{ 'keine' not in states('sensor.mullabholung_heute') | lower }}"
          selector:
            template: {}

        morning_max_repeats:
          name: Max. Wiederholungen (morgens)
          description: Wie oft morgens maximal erinnern?
          default: 2
          selector:
            number:
              min: 1
              max: 10
              step: 1

        morning_interval:
          name: Wiederholungsintervall (morgens)
          description: Minuten zwischen Morgen-Erinnerungen.
          default: 15
          selector:
            number:
              min: 5
              max: 60
              step: 5
              unit_of_measurement: min

variables:
  _action_id: >
    {{ 'MUELL_' ~ (this.entity_id
        | replace('automation.', '')
        | upper
        | replace('-', '_')
        | replace(' ', '_')) ~ '_OK' }}
  _tag: "muell_{{ this.entity_id | replace('.', '_') }}"
  _title: !input notification_title
  _confirmed: !input confirmed_boolean
  _targets: !input notify_targets
  _max: !input max_repeats
  _interval: !input repeat_interval
  _morning: !input morning_reminder
  _morning_max: !input morning_max_repeats
  _morning_int: !input morning_interval

triggers:
  - trigger: time
    at: !input notification_time
    id: abend
  - trigger: time
    at: !input morning_time
    id: morgen

conditions: []

actions:
  - choose:
      # ── ABEND: Abholung morgen ─────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: abend
          - condition: template
            value_template: !input abend_bedingung
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input confirmed_boolean

          - repeat:
              while:
                - condition: state
                  entity_id: !input confirmed_boolean
                  state: "off"
                - condition: template
                  value_template: "{{ repeat.index <= _max | int }}"
              sequence:
                - repeat:
                    for_each: !input notify_targets
                    sequence:
                      - action: "{{ repeat.item }}"
                        data:
                          title: "{{ _title }}"
                          message: !input notification_message
                          data:
                            tag: "{{ _tag }}"
                            sticky: "true"
                            actions:
                              - action: "{{ _action_id }}"
                                title: "✓ Tonne rausgestellt"

                - wait_for_trigger:
                    - trigger: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ _action_id }}"
                  timeout:
                    minutes: "{{ _interval | int }}"
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  then:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: !input confirmed_boolean
                    - repeat:
                        for_each: !input notify_targets
                        sequence:
                          - action: "{{ repeat.item }}"
                            data:
                              title: "✅ Tonne ist raus!"
                              message: "Bestätigung erhalten – Danke!"
                              data:
                                tag: "{{ _tag }}"

      # ── MORGEN: Abholung heute, noch nicht bestätigt ───────────────────────
      - conditions:
          - condition: trigger
            id: morgen
          - condition: template
            value_template: "{{ _morning }}"
          - condition: state
            entity_id: !input confirmed_boolean
            state: "off"
          - condition: template
            value_template: !input morgen_bedingung
        sequence:
          - repeat:
              while:
                - condition: state
                  entity_id: !input confirmed_boolean
                  state: "off"
                - condition: template
                  value_template: "{{ repeat.index <= _morning_max | int }}"
              sequence:
                - repeat:
                    for_each: !input notify_targets
                    sequence:
                      - action: "{{ repeat.item }}"
                        data:
                          title: "⚠️ {{ _title }}"
                          message: !input notification_message
                          data:
                            tag: "{{ _tag }}"
                            sticky: "true"
                            actions:
                              - action: "{{ _action_id }}"
                                title: "✓ Tonne rausgestellt"

                - wait_for_trigger:
                    - trigger: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ _action_id }}"
                  timeout:
                    minutes: "{{ _morning_int | int }}"
                  continue_on_timeout: true

                - if:
                    - condition: template
                      value_template: "{{ wait.trigger is not none }}"
                  then:
                    - action: input_boolean.turn_on
                      target:
                        entity_id: !input confirmed_boolean
                    - repeat:
                        for_each: !input notify_targets
                        sequence:
                          - action: "{{ repeat.item }}"
                            data:
                              title: "✅ Tonne ist raus!"
                              message: "Bestätigung erhalten – Danke!"
                              data:
                                tag: "{{ _tag }}"

mode: queued
max: 2
